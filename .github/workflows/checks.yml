name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: Library checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install pymupdf pytest -r requirements-pages.txt
      - name: Unit tests
        run: python -m pytest
      - name: Generated indexes and tables are up to date
        run: |
          python -m tools.build_indexes --strict
          python -m tools.build_tables --strict
          git diff --exit-code
      - name: Relative links
        run: python -m tools.check_links
      - name: Public-tree policy
        run: python -m tools.check_public_tree --cjk strict
      - name: Git LFS reading assets
        run: python -m tools.check_lfs_assets
