<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>移动机器人论文库 · WHEELTEC</title>
<style>
:root {
  --ink:#24292f; --muted:#636c76; --faint:#8c959f; --line:#d8dee4;
  --soft-line:#eaeef2; --blue:#1d4e96; --selected:#edf3fa; --subtle:#f6f8fa;
  --font:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button{border:0;background:none}
button:disabled{color:var(--faint);cursor:default}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button[aria-pressed=true]{color:var(--blue)}
button svg,a svg{width:15px;height:15px;flex:none}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:absolute;top:-100px;left:20px;padding:12px;background:white;z-index:10}
.skip:focus{top:8px}
.site-header{background:#242b35;color:#e4e8ed}
.header-inner{max-width:1480px;margin:auto;padding:0 40px;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:19px;white-space:nowrap}
.brand strong{font-size:14px;font-weight:650;letter-spacing:.07em;color:#fff}
.brand span{font-size:13px;padding-left:19px;border-left:1px solid #515861;color:#c1c8d0}
.header-nav{display:flex;gap:24px;font-size:12px}
.header-nav a{color:#c7cdd5}
.header-nav a:hover{color:white}
.wrap{max-width:1480px;margin:0 auto;padding:0 40px}
.page-heading{padding:29px 0 24px}
.page-heading h1{font-size:25px;line-height:1.4;font-weight:600;letter-spacing:.015em}
.page-heading p{margin-top:7px;font-size:13px;color:var(--muted)}
.collection-summary{display:flex;align-items:center;gap:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:28px;font-variant-numeric:tabular-nums}
.total-block{display:flex;align-items:baseline;gap:8px;padding-right:27px;border-right:1px solid var(--line)}
.total-number{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.03em}
.total-label{font-size:12px;color:var(--muted);white-space:nowrap}
.type-stat-line{display:flex;gap:28px}
.type-stat{display:flex;gap:8px;align-items:baseline}
.type-stat strong{font-size:21px;font-weight:500;line-height:1.2}
.type-stat span{font-size:12px;color:var(--muted)}
.summary-note{margin-left:auto;display:flex;gap:22px;font-size:12px;color:var(--muted)}
.reading-layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;align-items:start}
.facets{border-right:1px solid var(--line);padding-right:22px;padding-bottom:20px}
.facet-section+.facet-section{margin-top:24px;border-top:1px solid var(--soft-line);padding-top:20px}
.facet-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.facet-heading h2{font-size:13px;font-weight:600}
.facet-heading small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.themes{display:grid;gap:2px}
.theme-card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:34px;text-align:left;padding:6px 8px;border-left:2px solid transparent;border-radius:2px}
.theme-card:hover{background:var(--subtle)}
.theme-card[aria-pressed=true]{border-left-color:var(--blue);background:var(--selected)}
.theme-name{font-size:12px;font-weight:400;line-height:1.5}
.theme-number{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.year-chart{display:flex;align-items:stretch;gap:6px;height:111px}
.year-column{display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;padding:0 1px}
.year-track{width:100%;flex:1;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding-top:23px;border-bottom:1px solid var(--line)}
.year-bar{height:var(--height);min-height:2px;width:16px;max-width:80%;background:#a7b6c7;position:relative}
.year-column.peak .year-bar{background:#446b9f}
.year-column.latest .year-bar{background:#748eae}
.year-column:hover .year-bar,.year-column[aria-pressed=true] .year-bar{background:var(--blue)}
.year-value{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted)}
.year-label{font-size:10px;line-height:1.5;padding-top:7px;white-space:nowrap;color:var(--muted)}
.year-column[aria-pressed=true] .year-label{color:var(--blue);font-weight:600}
.chart-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.source-tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:0 0 7px}
.source-tabs button{padding:2px 0 7px;font-size:11px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.source-tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.source-list{display:grid;gap:2px}
.source-item{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px;border-radius:2px}
.source-item:hover,.source-item[aria-pressed=true]{background:var(--selected)}
.source-name{font-size:11px;line-height:1.65;overflow-wrap:anywhere}
.source-number{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.source-foot{padding:9px 8px 0}
.text-button{color:var(--blue);padding:0;font-size:12px}
.text-button:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.papers-section{min-width:0;scroll-margin-top:22px}
.papers-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}
.papers-heading h2{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.papers-heading h2 span{font-size:13px;font-weight:400;color:var(--muted)}
.result-summary{font-size:11px;line-height:1.6;color:var(--muted);margin-top:5px}
.result-tools{display:flex;align-items:center;gap:15px;font-size:12px;color:var(--muted);white-space:nowrap}
.result-tools select{font-size:12px;background:white;border:0;padding:5px 0;max-width:125px}
.outline-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c9d1d9;background:#fff;border-radius:3px;min-height:32px;padding:5px 10px;font-size:12px;line-height:1.5}
.outline-button:hover:not(:disabled){background:var(--subtle);border-color:#9ba7b4}
.filters{margin-bottom:16px}
.search-line{display:flex;align-items:center;gap:10px;border:1px solid #bcc5cf;border-radius:3px;min-height:41px;padding:0 12px}
.search-line:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.search-line svg{width:17px;height:17px;color:var(--muted);flex:none}
.search-line input{min-width:0;width:100%;font-size:13px;background:none;border:0;padding:9px 0;outline:none}
.search-line kbd{font:11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:2px;min-width:19px;text-align:center}
.filter-grid{display:grid;grid-template-columns:1fr .8fr 1.55fr 1.35fr auto;gap:12px;padding-top:12px;align-items:end}
.field{min-width:0}
.field-label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field select{width:100%;min-width:0;min-height:33px;padding:5px 20px 5px 8px;border:1px solid var(--line);border-radius:3px;background:white;font-size:12px;text-overflow:ellipsis}
.year-range{display:flex;align-items:center;gap:6px}
.year-range select{flex:1;min-width:0}
.year-range span{font-size:11px;color:var(--muted)}
.reset{min-height:33px;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.chip{display:flex;align-items:center;gap:8px;font-size:11px;border:1px solid #cbd8e8;border-radius:3px;padding:3px 7px;background:#f3f7fc;max-width:100%;text-align:left;overflow-wrap:anywhere;color:var(--blue)}
.chip span{color:var(--muted)}
.table-shell{border-top:1px solid #aeb8c3;overflow:hidden}
table{width:100%;table-layout:fixed;text-align:left;border-collapse:collapse}
th{padding:10px 12px;font-size:11px;color:var(--muted);font-weight:500;background:var(--subtle);border-bottom:1px solid var(--line)}
th:first-child{width:57%;padding-left:0}
th:nth-child(2){width:23%}
th:nth-child(3){width:7%}
th:last-child{width:13%;padding-right:0}
td{padding:17px 12px;border-bottom:1px solid var(--soft-line);vertical-align:top}
td:first-child{padding-left:0}
td:last-child{padding-right:0}
tbody tr:hover{background:#fafbfc}
.paper-title{font-size:15px;font-weight:500;line-height:1.6;overflow-wrap:anywhere}
.paper-title a{color:var(--blue)}
.paper-subline{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
.paper-subline span+span::before{content:'·';margin-right:8px;color:var(--faint)}
.venue-name{font-size:12px;font-weight:500;display:block;line-height:1.65;overflow-wrap:anywhere}
.venue-full{font-size:11px;line-height:1.6;color:var(--muted);display:block;margin-top:3px;overflow-wrap:anywhere}
.type-label{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.paper-year{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.reading-links{display:flex;gap:11px;flex-wrap:wrap;font-size:12px;line-height:1.8}
.reading-links a{white-space:nowrap}
.aux-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:11px;line-height:1.8}
.aux-links a{color:var(--muted)}
.paper-detail{display:inline;font-size:11px;color:var(--muted);margin-left:12px}
.paper-detail summary{display:inline;cursor:pointer}
.paper-detail summary::after{content:' ▾';font-size:9px}
.paper-detail[open]{display:block;margin:9px 0 0}
.paper-detail[open] summary::after{content:' ▴'}
.paper-detail summary:hover{color:var(--blue)}
.paper-detail p{margin-top:8px;line-height:1.7}
.paper-detail a{overflow-wrap:anywhere}
.empty{padding:50px 20px;text-align:center;border-bottom:1px solid var(--line)}
.empty svg{width:26px;height:26px;color:var(--faint);margin-bottom:12px}
.empty h3{font-size:16px;font-weight:500}
.empty p{color:var(--muted);font-size:12px;margin:8px 0 18px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 28px;color:var(--muted);font-size:12px}
.pagination select{font-size:12px;padding:4px 6px;margin:0 3px;border:1px solid var(--line);border-radius:3px;background:white}
.page-tools{display:flex;align-items:center;gap:12px}
.page-tools span{font-size:11px;font-variant-numeric:tabular-nums}
.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0 25px;border-top:1px solid var(--line);margin-top:20px;color:var(--muted);font-size:11px}
.footer a{color:var(--muted)}
.noscript{margin:20px;padding:20px;border:1px solid var(--line)}

<a class="skip" href="#papers">跳到论文列表</a>
<header class="site-header"><div class="header-inner"><div class="brand"><strong>WHEELTEC</strong><span>机器人研究资料</span></div><nav class="header-nav" aria-label="页面导航"><a href="README.md">论文库说明</a><a href="05-survey/manuscript/survey.pdf" target="_blank" rel="noopener">研究综述 ↗</a><a href="#papers">论文目录</a></nav></div></header>
<div class="wrap">
<div class="page-heading"><h1 id="page-title">移动机器人论文库</h1><p>按研究方向、发表年份和期刊 / 会议检索已收录论文。</p></div>
<section class="collection-summary" aria-label="论文收录概况"><div class="total-block"><strong class="total-number" id="total"></strong><span class="total-label">篇论文</span></div><div class="type-stat-line" id="type-stats"></div><div class="summary-note" id="summary-note"></div></section>
<div class="reading-layout">
<aside id="overview" class="facets" aria-label="论文分布与分类">
  <section class="facet-section themes-section"><div class="facet-heading"><h2>研究方向</h2><small>篇数</small></div><div class="themes" id="themes" role="group" aria-label="按研究方向浏览"></div></section>
  <section class="facet-section years-section"><div class="facet-heading"><h2>发表年份</h2><small id="year-span"></small></div><div class="year-chart" id="year-chart" role="group" aria-label="按发表年份浏览"></div><p class="chart-note" id="chart-note"></p></section>
  <section class="facet-section sources-section"><div class="facet-heading"><h2>发表来源</h2><small id="source-total"></small></div><div class="source-tabs" id="source-tabs" role="group" aria-label="来源类型"></div><div class="source-list" id="source-list" role="group" aria-label="期刊和会议论文数量"></div><div class="source-foot"><button class="text-button" id="source-expand" type="button"></button></div></section>
</aside>
<main class="papers-section" id="papers" tabindex="-1">
  <div class="papers-heading"><div><h2>论文目录 <span id="count" aria-live="polite" aria-atomic="true"></span></h2><p id="result-summary" class="result-summary"></p></div><div class="result-tools"><label>排序 <select id="sort" aria-label="论文排序"><option value="newest">年份从新到旧</option><option value="oldest">年份从旧到新</option><option value="title">标题 A–Z</option><option value="venue">发表来源 A–Z</option></select></label><button id="export" class="outline-button" type="button">导出清单</button></div></div>
  <div class="filters" role="search" aria-label="搜索和筛选论文"><label class="search-line"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索论文标题、关键词、期刊或会议、DOI</span><input id="search" type="search" placeholder="搜索标题、关键词、期刊 / 会议或 DOI" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>

,"publication_type":"journal","pdf":"01-papers/T4-multi-robot-coordination/2026-FT-formation-swarm-X13/paper.pdf","bibtex":"01-papers/T4-multi-robot-coordination/2026-FT-formation-swarm-X13/citation.bib","markdown":"02-fulltext/T4-multi-robot-coordination/2026-FT-formation-swarm-X13/paper.md","review":"03-reviews/T4-multi-robot-coordination/2026-FT-formation-swarm-X13/review.md","screening_reason":"","citation_status":"","survey_selected":"yes","venue_family":"IEEE Systems Journal"},{"code":"X15","theme":"T5","title":"Socially compliant mobile robot navigation via inverse reinforcement learning","bibliographic_year":"2016","venue":"The International Journal of Robotics Research","doi":"10.1177/0278364915619772","official_url":"https://doi.org/10.1177/0278364915619772","assessment":"Light review card; internal reference","view_group":"main","kind":"assessed","publication_type":"journal","pdf":"01-papers/T5-semantic-embodied-navigation/2016-IRL-social-nav-X15/paper.pdf","bibtex":"01-papers/T5-semantic-embodied-navigation/2016-IRL-social-nav-X15/citation.bib","markdown":"02-fulltext/T5-semantic-embodied-navigation/2016-IRL-social-nav-X15/paper.md","review":"03-reviews/T5-semantic-embodied-navigation/2016-IRL-social-nav-X15/review.md","screening_reason":"","citation_status":"","survey_selected":"no","venue_family":"The International Journal of Robotics Research"}]</script>
<script>
'use strict';
const records=JSON.parse(document.getElementById('catalog-data').textContent);
const $=id=>document.getElementById(id);
const node=(tag,text='',cls='')=>{const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el;};
const themes={
  T1:{name:'定位与传感器融合'}, T2:{name:'SLAM 与地图构建'},
  T3:{name:'路径规划与控制'}, T4:{name:'多机器人协同'},
  T5:{name:'语义与具身导航'}, T6:{name:'系统部署与评测'}
};
const venueLabels={
  'IEEE Transactions on Robotics':'IEEE T-RO',
  'IEEE Robotics and Automation Letters':'IEEE RA-L',
  'The International Journal of Robotics Research':'IJRR',
  'IEEE Transactions on Automation Science and Engineering':'IEEE T-ASE',
  'IEEE Transactions on Intelligent Vehicles':'IEEE T-IV',
  'IEEE Transactions on Intelligent Transportation Systems':'IEEE T-ITS',
  'IEEE/ASME Transactions on Mechatronics':'IEEE/ASME T-Mech',
  'IEEE Transactions on Automatic Control':'IEEE TAC',
  'Annual Review of Control, Robotics, and Autonomous Systems':'Annual Review of Control, Robotics, and Autonomous Systems',
  'IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)':'CVPR',
  'Neural Information Processing Systems Track on Datasets and Benchmarks':'NeurIPS Datasets and Benchmarks'
};
const labels={journal:'期刊论文',conference:'会议论文',other:'其他论文'};
const defaults={search:'',theme:'',type:'',venue:'',from:'',to:'',sort:'newest',size:'20'};
let state={...defaults},page=1,filtered=[],sourceTab='all',sourcesExpanded=false;
const kind=r=>['journal','conference'].includes(r.publication_type)?r.publication_type:'other';
const shortVenue=v=>venueLabels[v]||v;
const searchText=new Map(records.map(r=>[r,[r.code,r.title,r.doi,r.venue,r.venue_family,shortVenue(r.venue_family),r.screening_reason,themes[r.theme]?.name].join(' ').toLowerCase()]));
function matches(r,s,omit=''){
  const tokens=s.search.trim().toLowerCase().split(/\s+/).filter(Boolean),year=+r.bibliographic_year;
  return tokens.every(t=>searchText.get(r).includes(t))&&
    (omit==='theme'||!s.theme||s.theme===r.theme)&&
    (omit==='type'||!s.type||s.type===kind(r))&&
    (omit==='venue'||!s.venue||s.venue===r.venue_family)&&
    (omit==='from'||!s.from||(year>0&&year>=+s.from))&&
    (omit==='to'||!s.to||(year>0&&year<=+s.to));
}
function selected(s,omit=''){return records.filter(r=>matches(r,s,omit));}
function facet(s,key){const counts=new Map();for(const r of selected(s,key)){const value=key==='venue'?r.venue_family:key==='type'?kind(r):['from','to'].includes(key)?r.bibliographic_year:r[key];if(value)counts.set(value,(counts.get(value)||0)+1);}return counts;}
function ordered(rows,sort){return [...rows].sort((a,b)=>{
  const fallback=()=>a.title.localeCompare(b.title)||a.code.localeCompare(b.code,undefined,{numeric:true});
  if(sort==='title')return fallback();
  if(sort==='venue')return a.venue_family.localeCompare(b.venue_family)||(+b.bibliographic_year||0)-(+a.bibliographic_year||0)||fallback();
  const ay=+a.bibliographic_year||0,by=+b.bibliographic_year||0;
  if(!ay||!by)return (by>0)-(ay>0)||fallback();
  return (sort==='oldest'?ay-by:by-ay)||fallback();
});}
function filterLabel(key,value){return key==='theme'?(themes[value]?.name||value):key==='type'?(labels[value]||value):value;}
function setOptions(key){
  const counts=facet(state,key),el=$(key),placeholder={theme:'全部研究方向',type:'全部类型',venue:'全部期刊 / 会议',from:'不限',to:'不限'}[key];
  const values=[...counts.keys()].filter(v=>counts.get(v)>0).sort((a,b)=>['from','to'].includes(key)?+b-+a:key==='theme'?a.localeCompare(b):key==='type'?['journal','conference','other'].indexOf(a)-['journal','conference','other'].indexOf(b):counts.get(b)-counts.get(a)||a.localeCompare(b));
  const first=node('option',values.length?placeholder:'暂无匹配选项');first.value='';el.replaceChildren(first);
  for(const value of values){const o=node('option',filterLabel(key,value)+(['from','to'].includes(key)?'':' · '+counts.get(value)+' 篇'));o.value=value;el.append(o);}
  // Preserve an applied filter through an empty result without offering zero-count alternatives.
  if(state[key]&&!counts.get(state[key])){const current=node('option',filterLabel(key,state[key]));current.value=state[key];current.hidden=true;el.append(current);}
  el.value=state[key];el.disabled=!values.length&&!state[key];
}
function safeLink(url){return /^(https?:\/\/)/i.test(url)||(!/^[a-z][a-z0-9+.-]*:/i.test(url)&&!url.startsWith('//')&&!url.includes('\\'));}
function link(url,label,cls='',code=''){if(!url||!safeLink(url))return null;const a=node('a',label,cls);a.href=url;a.target='_blank';a.rel='noopener';if(code)a.setAttribute('aria-label',label+' · '+code);return a;}
function appendLink(parent,...args){const a=link(...args);if(a)parent.append(a);}
function row(r){
  const tr=node('tr');tr.dataset.code=r.code;
  const paper=node('td'),title=node('h3','','paper-title'),titleLink=link(r.pdf||r.official_url,r.title);
  title.append(titleLink||document.createTextNode(r.title));paper.append(title);
  const sub=node('div','','paper-subline');if(themes[r.theme])sub.append(node('span',themes[r.theme].name,'paper-theme'));if(r.kind==='survey')sub.append(node('span','综述'));paper.append(sub);
  if(r.screening_reason||r.doi||r.review||r.citation_status==='derived'){
    const detail=node('details','','paper-detail');detail.append(node('summary','论文详情'));
    if(r.screening_reason)detail.append(node('p',r.screening_reason));
    if(r.doi){const p=node('p');appendLink(p,'https://doi.org/'+r.doi,'DOI: '+r.doi);detail.append(p);}
    if(r.review){const p=node('p');appendLink(p,r.review,'阅读笔记');detail.append(p);}
    if(r.citation_status==='derived')detail.append(node('p','此条引用信息经过整理，使用时请核对论文原文。'));
    detail.append(node('p','编号 '+r.code));paper.append(detail);
  }
  const venue=node('td','','venue-cell'),family=r.venue_family;
  if(family){venue.append(node('span',shortVenue(family),'venue-name'));if(shortVenue(family)!==r.venue)venue.append(node('span',r.venue,'venue-full'));}
  if(labels[kind(r)])venue.append(node('span',labels[kind(r)],'type-label'));
  const year=node('td','','year-cell');if(r.bibliographic_year)year.append(node('span',r.bibliographic_year,'paper-year'));
  const files=node('td','','files-cell'),reading=node('div','','reading-links'),aux=node('div','','aux-links');
  appendLink(reading,r.pdf,'PDF','primary',r.code);appendLink(reading,r.markdown,'全文','',r.code);
  appendLink(aux,r.bibtex,'引用','',r.code);appendLink(aux,r.official_url,'出版页 ↗','',r.code);
  if(reading.childNodes.length)files.append(reading);if(aux.childNodes.length)files.append(aux);
  tr.append(paper,venue,year,files);return tr;
}
function countBy(rows,key){const counts=new Map();for(const r of rows){const v=typeof key==='function'?key(r):r[key];if(v)counts.set(v,(counts.get(v)||0)+1);}return counts;}
const typeCounts=countBy(records,kind),yearCounts=countBy(records,'bibliographic_year'),themeCounts=countBy(records,'theme');
const sourceCounts=countBy(records,'venue_family');
const sources=[...sourceCounts].map(([name,count])=>({name,count,type:kind(records.find(r=>r.venue_family===name))})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
function focusCollection(filters){state={...defaults,...filters};page=1;render();$('papers').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function renderSources(){
  $('source-tabs').replaceChildren();
  for(const [value,label]of [['all','全部'],['journal','期刊'],['conference','会议']]){
    const count=sources.filter(s=>value==='all'||s.type===value).length;if(!count)continue;
    const b=node('button',label);b.type='button';b.dataset.tab=value;b.setAttribute('aria-pressed',String(sourceTab===value));b.addEventListener('click',()=>{sourceTab=value;sourcesExpanded=false;renderSources();});$('source-tabs').append(b);
  }
  const values=sources.filter(s=>sourceTab==='all'||s.type===sourceTab),visible=sourcesExpanded?values:values.slice(0,6);
  $('source-list').replaceChildren(...visible.map(s=>{
    const b=node('button','','source-item '+s.type);b.type='button';b.dataset.venue=s.name;b.title=s.name;b.setAttribute('aria-label',s.name+'，'+s.count+' 篇论文');b.setAttribute('aria-pressed',String(state.venue===s.name));
    const name=node('span',s.name,'source-name');
    b.append(name,node('span',String(s.count),'source-number'));b.addEventListener('click',()=>focusCollection({venue:s.name}));return b;
  }));
  $('source-expand').hidden=values.length<=6;$('source-expand').textContent=sourcesExpanded?'收起':'全部来源 ('+values.length+')';
}
function overview(){
  $('total').textContent=records.length.toLocaleString('zh-CN');
  for(const type of ['journal','conference','other']){const count=typeCounts.get(type);if(!count)continue;const stat=node('div','','type-stat');stat.append(node('strong',String(count)),node('span',labels[type]));$('type-stats').append(stat);}
  if(sources.length)$('summary-note').append(node('span',sources.length+' 个期刊与会议'));
  const readable=records.filter(r=>r.pdf&&r.markdown).length;if(readable)$('summary-note').append(node('span',readable===records.length?'均提供 PDF 与全文':readable+' 篇提供 PDF 与全文'));
  const years=[...yearCounts.keys()].filter(y=>+y>0).map(Number).sort((a,b)=>a-b),latest=years.at(-1),recent=years.filter(y=>y>=latest-5),earlier=years.filter(y=>y<latest-5);
  if(years.length)$('year-span').textContent=years[0]===latest?String(latest):years[0]+'—'+latest;
  const bins=recent.map(y=>({label:String(y),count:yearCounts.get(String(y)),from:String(y),to:String(y)}));
  if(earlier.length)bins.unshift({label:'更早',count:earlier.reduce((n,y)=>n+yearCounts.get(String(y)),0),from:'',to:String(latest-6),earlier:true});
  const peak=Math.max(1,...bins.map(b=>b.count));
  for(const bin of bins){
    const b=node('button','','year-column'+(bin.count===peak?' peak':bin.to===String(latest)?' latest':''));b.type='button';b.dataset.from=bin.from;b.dataset.to=bin.to;b.dataset.count=bin.count;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','查看 '+(bin.earlier?bin.to+' 年及以前':bin.label+' 年')+'的 '+bin.count+' 篇论文');
    const track=node('span','','year-track'),bar=node('span','','year-bar');bar.style.setProperty('--height',bin.count/peak*100+'%');bar.append(node('span',String(bin.count),'year-value'));track.append(bar);b.append(track,node('span',bin.label,'year-label'));b.addEventListener('click',()=>focusCollection({from:bin.from,to:bin.to}));$('year-chart').append(b);
  }
  const last3=years.filter(y=>y>=latest-2).reduce((n,y)=>n+yearCounts.get(String(y)),0);
  if(last3&&years.length>1)$('chart-note').textContent=(latest-2)+'—'+latest+' 年共 '+last3+' 篇，占 '+Math.round(last3/Math.max(1,records.length)*100)+'%'+(earlier.length?'；更早年份包含 '+earlier.join('、')+' 年':'');
  for(const [key,info]of Object.entries(themes)){
    const count=themeCounts.get(key);if(!count)continue;
    const b=node('button','','theme-card');b.type='button';b.dataset.theme=key;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',info.name+'，'+count+' 篇论文');
    b.append(node('span',info.name,'theme-name'),node('span',String(count),'theme-number'));b.addEventListener('click',()=>focusCollection({theme:key}));$('themes').append(b);
  }
  $('source-total').textContent=sources.length+' 个';
  $('footer-count').textContent=' · '+records.length+' 篇论文';renderSources();
}
function chips(){
  const holder=$('chips');holder.replaceChildren();
  const add=(text,keys)=>{const b=node('button',text,'chip');b.type='button';b.append(node('span','×'));b.setAttribute('aria-label','移除筛选：'+text);b.addEventListener('click',()=>{for(const k of keys)state[k]=defaults[k];render(true);});holder.append(b);};
  for(const key of ['search','theme','type','venue'])if(state[key])add(({search:'搜索',theme:'方向',type:'类型',venue:'来源'}[key])+': '+filterLabel(key,state[key]),[key]);
  if(state.from||state.to)add('年份: '+(state.from&&state.from===state.to?state.from:(state.from||'不限')+'—'+(state.to||'不限')),['from','to']);
  holder.hidden=!holder.childNodes.length;
}
function render(resetPage=false){
  if(resetPage)page=1;
  for(const key of ['theme','type','venue','from','to'])setOptions(key);
  for(const key of ['search','sort','size'])if($(key).value!==state[key])$(key).value=state[key];
  filtered=ordered(selected(state),state.sort);
  const size=state.size==='all'?Math.max(1,filtered.length):+state.size,pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);const start=(page-1)*size,end=Math.min(start+size,filtered.length);
  $('rows').replaceChildren(...filtered.slice(start,end).map(row));$('empty').hidden=!!filtered.length;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('export').disabled=!filtered.length;$('page-label').textContent='第 '+page+' / '+pages+' 页';
  $('count').textContent=String(filtered.length)+' 篇';
  const breakdown=[...countBy(filtered,kind)].filter(([,n])=>n>0).map(([type,n])=>labels[type]+' '+n+' 篇').join(' · ');
  const applied=['search','theme','type','venue','from','to'].some(k=>state[k]);
  $('result-summary').textContent=(applied?'从全部 '+records.length+' 篇中筛选':'全部论文')+(breakdown?' · '+breakdown:'')+(filtered.length?' · 当前显示 '+(start+1)+'—'+end+' 篇':'');
  $('reset').disabled=!applied;
  $('empty-note').textContent=state.from&&state.to&&+state.from>+state.to?'起始年份晚于结束年份，请调整年份范围。':'试试其他关键词，或放宽年份和来源条件。';
  chips();
  for(const b of document.querySelectorAll('.year-column'))b.setAttribute('aria-pressed',String(state.from===b.dataset.from&&state.to===b.dataset.to));
  for(const b of document.querySelectorAll('.theme-card'))b.setAttribute('aria-pressed',String(state.theme===b.dataset.theme));
  for(const b of document.querySelectorAll('.source-item'))b.setAttribute('aria-pressed',String(state.venue===b.dataset.venue));
  save();
}
function restore(){
  const p=new URLSearchParams(location.hash.slice(1));state={...defaults};
  for(const key of Object.keys(defaults)){const value=p.get(key);if(value!==null)state[key]=value;}
  // Old management-only filters are deliberately ignored in this reading view.
  for(const key of ['theme','type','venue']){const values=new Set(records.map(r=>key==='type'?kind(r):key==='venue'?r.venue_family:r[key]));if(state[key]&&!values.has(state[key]))state[key]='';}
  for(const key of ['from','to'])if(state[key]&&(!/^\d{4}$/.test(state[key])))state[key]='';
  if(!['newest','oldest','title','venue'].includes(state.sort))state.sort=defaults.sort;
  if(!['20','50','100','all'].includes(state.size))state.size=defaults.size;
  page=Math.max(1,Number.parseInt(p.get('page'),10)||1);
}
function save(){const params=new URLSearchParams();for(const[k,v]of Object.entries(state))if(v!==defaults[k])params.set(k,v);if(page>1)params.set('page',page);try{history.replaceState(null,'',location.pathname+location.search+(params.size?'#'+params.toString():''));}catch(e){/* Some file URL hosts restrict history; reading still works. */}}
function reset(){state={...defaults};render(true);}
for(const key of Object.keys(defaults))$(key).addEventListener(key==='search'?'input':'change',()=>{state[key]=$(key).value;render(true);});
$('reset').addEventListener('click',reset);$('empty-reset').addEventListener('click',reset);
$('source-expand').addEventListener('click',()=>{sourcesExpanded=!sourcesExpanded;renderSources();});
for(const [id,direction]of [['prev',-1],['next',1]])$(id).addEventListener('click',()=>{page+=direction;render();$('papers').scrollIntoView({behavior:'instant'});$('papers').focus({preventScroll:true});});
$('export').addEventListener('click',()=>{
  const fields=[['code','编号'],['bibliographic_year','年份'],['title','论文标题'],['venue','期刊或会议'],['publication_type','类型'],['doi','DOI'],['theme','研究方向'],['pdf','PDF'],['markdown','全文'],['bibtex','引用文件']];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',values=filtered.map(r=>fields.map(([key])=>key==='theme'?themes[r.theme]?.name||r.theme:key==='publication_type'?labels[kind(r)]:r[key]));
  const csv='\ufeff'+[fields.map(([,label])=>label),...values].map(r=>r.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=node('a');a.href=url;a.download='wheeltec-papers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();$('search').focus();}});
window.addEventListener('hashchange',()=>{if(['#papers','#overview'].includes(location.hash))return;restore();render();});
overview();restore();render();
window.LibraryEngine={matches,selected,ordered,facet,defaults};
</script>
