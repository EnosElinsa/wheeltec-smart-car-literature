<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>移动机器人论文与开源项目 · WHEELTEC</title>
<style>
:root {
  --ink:#24292f; --muted:#636c76; --faint:#8c959f; --line:#d8dee4;
  --soft-line:#eaeef2; --blue:#1d4e96; --selected:#edf3fa; --subtle:#f6f8fa;
  --font:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button{border:0;background:none}
button:disabled{color:var(--faint);cursor:default}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button[aria-pressed=true]{color:var(--blue)}
button svg,a svg{width:15px;height:15px;flex:none}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:absolute;top:-100px;left:20px;padding:12px;background:white;z-index:10}
.skip:focus{top:8px}
.site-header{background:#242b35;color:#e4e8ed}
.header-inner{max-width:1480px;margin:auto;padding:0 40px;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:19px;white-space:nowrap}
.brand strong{font-size:14px;font-weight:650;letter-spacing:.07em;color:#fff}
.brand span{font-size:13px;padding-left:19px;border-left:1px solid #515861;color:#c1c8d0}
.header-nav{display:flex;gap:24px;font-size:12px}
.header-nav a{color:#c7cdd5}
.header-nav a:hover{color:white}
.wrap{max-width:1480px;margin:0 auto;padding:0 40px}
.page-heading{padding:29px 0 24px}
.page-heading h1{font-size:25px;line-height:1.4;font-weight:600;letter-spacing:.015em}
.reading-layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;align-items:start}
.facets{border-right:1px solid var(--line);padding-right:22px;padding-bottom:20px}
.facet-section+.facet-section{margin-top:24px;border-top:1px solid var(--soft-line);padding-top:20px}
.facet-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.facet-heading h2{font-size:13px;font-weight:600}
.facet-heading small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.themes{display:grid;gap:2px}
.theme-card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:34px;text-align:left;padding:6px 8px;border-left:2px solid transparent;border-radius:2px}
.theme-card:hover{background:var(--subtle)}
.theme-card[aria-pressed=true]{border-left-color:var(--blue);background:var(--selected)}
.theme-name{font-size:12px;font-weight:400;line-height:1.5}
.theme-number{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.year-chart{display:flex;align-items:stretch;gap:6px;height:111px}
.year-column{display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;padding:0 1px}
.year-track{width:100%;flex:1;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding-top:23px;border-bottom:1px solid var(--line)}
.year-bar{height:var(--height);min-height:2px;width:16px;max-width:80%;background:#a7b6c7;position:relative}
.year-column.peak .year-bar{background:#446b9f}
.year-column.latest .year-bar{background:#748eae}
.year-column:hover .year-bar,.year-column[aria-pressed=true] .year-bar{background:var(--blue)}
.year-value{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted)}
.year-label{font-size:10px;line-height:1.5;padding-top:7px;white-space:nowrap;color:var(--muted)}
.year-column[aria-pressed=true] .year-label{color:var(--blue);font-weight:600}
.source-tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:0 0 7px}
.source-tabs button{padding:2px 0 7px;font-size:11px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.source-tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.source-list{display:grid;gap:2px}
.source-item{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px;border-radius:2px}
.source-item:hover,.source-item[aria-pressed=true]{background:var(--selected)}
.source-name{font-size:11px;line-height:1.65;overflow-wrap:anywhere}
.source-number{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.source-foot{padding:9px 8px 0}
.text-button{color:var(--blue);padding:0;font-size:12px}
.text-button:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.papers-section{min-width:0;scroll-margin-top:22px}
.papers-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}
.papers-heading h2{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.papers-heading h2 span{font-size:13px;font-weight:400;color:var(--muted)}
.result-summary{font-size:11px;line-height:1.6;color:var(--muted);margin-top:5px}
.result-tools{display:flex;align-items:center;gap:15px;font-size:12px;color:var(--muted);white-space:nowrap}
.result-tools select{font-size:12px;background:white;border:0;padding:5px 0;max-width:125px}
.outline-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c9d1d9;background:#fff;border-radius:3px;min-height:32px;padding:5px 10px;font-size:12px;line-height:1.5}
.outline-button:hover:not(:disabled){background:var(--subtle);border-color:#9ba7b4}
.filters{margin-bottom:16px}
.search-line{display:flex;align-items:center;gap:10px;border:1px solid #bcc5cf;border-radius:3px;min-height:41px;padding:0 12px}
.search-line:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.search-line svg{width:17px;height:17px;color:var(--muted);flex:none}
.search-line input{min-width:0;width:100%;font-size:13px;background:none;border:0;padding:9px 0;outline:none}
.search-line kbd{font:11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:2px;min-width:19px;text-align:center}
.filter-grid{display:grid;grid-template-columns:1fr .8fr 1.55fr 1.35fr auto;gap:12px;padding-top:12px;align-items:end}
.field{min-width:0}
.field-label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field select{width:100%;min-width:0;min-height:33px;padding:5px 20px 5px 8px;border:1px solid var(--line);border-radius:3px;background:white;font-size:12px;text-overflow:ellipsis}
.year-range{display:flex;align-items:center;gap:6px}
.year-range select{flex:1;min-width:0}
.year-range span{font-size:11px;color:var(--muted)}
.reset{min-height:33px;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.chip{display:flex;align-items:center;gap:8px;font-size:11px;border:1px solid #cbd8e8;border-radius:3px;padding:3px 7px;background:#f3f7fc;max-width:100%;text-align:left;overflow-wrap:anywhere;color:var(--blue)}
.chip span{color:var(--muted)}
.table-shell{border-top:1px solid #aeb8c3;overflow:hidden}
table{width:100%;table-layout:fixed;text-align:left;border-collapse:collapse}
th{padding:10px 12px;font-size:11px;color:var(--muted);font-weight:500;background:var(--subtle);border-bottom:1px solid var(--line)}
th:first-child{width:57%;padding-left:0}
th:nth-child(2){width:23%}
th:nth-child(3){width:7%}
th:last-child{width:13%;padding-right:0}
td{padding:17px 12px;border-bottom:1px solid var(--soft-line);vertical-align:top}
td:first-child{padding-left:0}
td:last-child{padding-right:0}
tbody tr:hover{background:#fafbfc}
.paper-title{font-size:15px;font-weight:500;line-height:1.6;overflow-wrap:anywhere}
.paper-title a{color:var(--blue)}
.paper-subline{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
.paper-subline span+span::before{content:'·';margin-right:8px;color:var(--faint)}
.venue-name{font-size:12px;font-weight:500;display:block;line-height:1.65;overflow-wrap:anywhere}
.venue-full{font-size:11px;line-height:1.6;color:var(--muted);display:block;margin-top:3px;overflow-wrap:anywhere}
.type-label{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.paper-year{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.reading-links{display:flex;gap:11px;flex-wrap:wrap;font-size:12px;line-height:1.8}
.reading-links a{white-space:nowrap}
.aux-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:11px;line-height:1.8}
.aux-links a{color:var(--muted)}
.paper-detail{display:inline;font-size:11px;color:var(--muted);margin-left:12px}
.paper-detail summary{display:inline;cursor:pointer}
.paper-detail summary::after{content:' ▾';font-size:9px}
.paper-detail[open]{display:block;margin:9px 0 0}
.paper-detail[open] summary::after{content:' ▴'}
.paper-detail summary:hover{color:var(--blue)}
.paper-detail p{margin-top:8px;line-height:1.7}
.paper-detail a{overflow-wrap:anywhere}
.empty{padding:50px 20px;text-align:center;border-bottom:1px solid var(--line)}
.empty svg{width:26px;height:26px;color:var(--faint);margin-bottom:12px}
.empty h3{font-size:16px;font-weight:500}
.empty>.outline-button{margin-top:16px}
.empty p{color:var(--muted);font-size:12px;margin:8px 0 18px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 28px;color:var(--muted);font-size:12px}
.pagination select{font-size:12px;padding:4px 6px;margin:0 3px;border:1px solid var(--line);border-radius:3px;background:white}
.page-tools{display:flex;align-items:center;gap:12px}
.page-tools span{font-size:11px;font-variant-numeric:tabular-nums}
.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0 25px;border-top:1px solid var(--line);margin-top:20px;color:var(--muted);font-size:11px}
.footer a{color:var(--muted)}
.noscript{margin:20px;padding:20px;border:1px solid var(--line)}
@media(min-width:1600px){.reading-layout{grid-template-columns:260px minmax(0,1fr);gap:40px}.wrap,.header-inner{padding-left:52px;padding-right:52px}}

@media(max-width:640px){.header-inner{min-height:48px}.wrap,.header-inner{padding-left:18px;padding-right:18px}.brand{gap:12px}.brand span{padding-left:12px;font-size:12px}.brand strong{font-size:12px}.header-nav{gap:14px;font-size:11px}.header-nav a:first-child{display:none}.page-heading{padding:23px 0 19px}.page-heading h1{font-size:23px}.reading-layout{display:flex;flex-direction:column;gap:0}.facets{border:0;padding:0;width:100%;margin-bottom:23px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.facet-section+.facet-section{margin:0;padding:0;border:0}.themes-section{grid-column:1/-1}.themes{grid-template-columns:1fr 1fr;gap:2px 9px}.theme-card{padding:5px 7px;min-height:31px}.theme-name{font-size:11px}.theme-number{font-size:11px}.facet-heading{margin-bottom:9px}.facet-heading h2{font-size:12px}.facet-heading small{font-size:10px}.years-section,.sources-section{border-top:1px solid var(--line)!important;padding-top:14px!important}.year-chart{height:107px;gap:3px}.year-value{font-size:9px}.year-label{font-size:9px}.year-bar{width:12px}.source-tabs{gap:14px}.source-list{max-height:139px;overflow:auto;scrollbar-width:thin}.source-item{padding:5px 3px;gap:6px;grid-template-columns:minmax(0,1fr) 22px}.source-name,.source-number{font-size:10px;line-height:1.6}.source-foot{padding:7px 3px 0}.source-foot button{font-size:10px}.source-tabs button{font-size:10px;padding-bottom:5px}.papers-section{width:100%;border-top:1px solid var(--line);padding-top:19px}.papers-heading{margin-bottom:12px}.papers-heading h2{font-size:16px}.result-summary{font-size:10px}.result-tools{font-size:11px}.result-tools select{font-size:11px}.outline-button{font-size:11px;min-height:30px;padding:5px 9px}.search-line input{font-size:12px}.search-line{min-height:39px;padding:0 10px}.search-line kbd{display:none}.filter-grid{gap:10px;padding-top:10px}.field-label{font-size:10px}.field select{font-size:11px;min-height:32px}.year-range select{min-width:90px}.pagination{align- @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.site-header,.facets,.filters,.result-tools,.chips,.pagination,.reading-links,.aux-links,.paper-detail{display:none!important}.wrap{max-width:none;padding:0}.reading-layout{display:block}.page-heading{padding:10px 0}tr{break-inside:avoid}.footer{margin-top:10px}}
.collection-tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin-bottom:22px}
.collection-tabs button{padding:0 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;font-weight:500;display:flex;gap:9px;align-items:center;color:var(--muted)}
.collection-tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue)}
.collection-tabs button span{font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.project-filter-grid{grid-template-columns:1.3fr 1.5fr 1fr .8fr auto}
.project-table-head{display:grid;grid-template-columns:1.15fr 1.25fr .8fr;gap:24px;padding:10px 0;background:var(--subtle);border-top:1px solid #aeb8c3;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.project-table-head span:first-child{padding-left:12px}
.project-item{padding:23px 0 18px;border-bottom:1px solid var(--line);scroll-margin-top:20px}
.project-grid{display:grid;grid-template-columns:1.15fr 1.25fr .8fr;gap:24px;align-items:start}
.project-name{font-size:17px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.project-category{font-size:11px;color:var(--muted);margin-top:4px}
.project-summary{font-size:12px;color:var(--muted);line-height:1.85;margin-top:9px;overflow-wrap:anywhere}
.project-algorithms{font-size:12px;line-height:1.85;font-weight:500;overflow-wrap:anywhere}
.project-io{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 8px;font-size:11px;line-height:1.8;margin:11px 0 0}
.project-io dt{color:var(--muted)}
.project-io dd{margin:0;overflow-wrap:anywhere}
.project-runtime{font-size:12px;line-height:1.9;overflow-wrap:anywhere}
.project-license{display:inline-block;font-size:10px;color:var(--muted);margin-top:5px}
.project-actions{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:12px;line-height:1.8}
.compare-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:13px;cursor:pointer;line-height:1.6}
.compare-toggle input{width:14px;height:14px;margin:0;accent-color:var(--blue)}
.compare-toggle:has(input:disabled){cursor:default;color:var(--faint)}
.project-details{font-size:11px;margin-top:12px}
.project-details>summary{display:inline-flex;align-items:center;gap:8px;color:var(--blue);cursor:pointer;list-style:none;line-height:1.9}
.project-details>summary::-webkit-details-marker{display:none}
.project-details>summary::before{content:'+';display:inline-block;font-size:14px;width:10px}
.project-details[open]>summary::before{content:'−'}
.project-detail-body{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:14px;padding:18px;background:#f8f9fb;border:1px solid var(--soft-line);border-radius:2px}
.project-detail-body h4{font-size:11px;font-weight:600;margin:0 0 9px;color:var(--ink)}
.project-detail-body .project-conditions-heading{margin-top:16px}
.project-detail-body p{font-size:12px;line-height:1.9;color:var(--muted);overflow-wrap:anywhere}
.project-extra-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;line-height:1.8}
.project-reference+.project-reference{padding-top:13px;margin-top:13px;border-top:1px solid var(--line)}
.project-reference-title{font-size:12px;line-height:1.8;overflow-wrap:anywhere}
.project-reference-meta{font-size:11px;color:var(--muted);line-height:1.8;margin-top:3px}
.project-reference-links{display:flex;gap:13px;flex-wrap:wrap;line-height:1.8;margin-top:6px}
.comparison{margin-top:28px;scroll-margin-top:20px;border-top:1px solid #aeb8c3;padding-top:20px}
.comparison-heading{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:18px}
.comparison-heading h2{font-size:17px;font-weight:600}
.comparison-heading h2 span{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.comparison-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
.comparison table{table-layout:fixed;min-width:620px}
.comparison th,.comparison td{padding:14px 16px!important;border-right:1px solid var(--soft-line);font-size:12px;line-height:1.9;overflow-wrap:anywhere;vertical-align:top;display:table-cell!important}
.comparison th{color:var(--ink);font-weight:500;background:var(--subtle)}
.comparison tr{display:table-row!important;padding:0}
.comparison thead{display:table-header-group!important}
.comparison tbody{display:table-row-group!important}
.comparison tr:last-child td{border-bottom:0}
.comparison th:first-child,.comparison td:first-child{width:110px!important;color:var(--muted);font-weight:400}
.comparison th:not(:first-child){width:auto!important}
.comparison td p+p{margin-top:10px}
.compare-remove{display:block;font-size:10px;color:var(--muted);padding:0;margin-top:6px}
.compare-remove:hover{color:var(--blue)}
.compare-tray{position:sticky;bottom:12px;margin:20px 0 0 280px;padding:11px 15px;border:1px solid #b9c6d5;box-shadow:0 2px 8px #24292f0c;background:#fff;display:flex;align-items:center;gap:16px;z-index:2;border-radius:3px;font-size:12px}
.compare-tray>span{margin-right:auto;color:var(--muted);overflow-wrap:anywhere}
.compare-tray .outline-button{flex:none}

function filterLabel(key,value){return key==='theme'?(themes[value]?.name||value):key==='type'?(labels[value]||value):value;}

function safeLink(url){return /^(https?:\/\/)/i.test(url)||(!/^[a-z][a-z0-9+.-]*:/i.test(url)&&!url.startsWith('//')&&!url.includes('\\'));}

function countBy(rows,key){const counts=new Map();for(const r of rows){const v=typeof key==='function'?key(r):r[key];if(v)counts.set(v,(counts.get(v)||0)+1);}return counts;}

function overview(){

  for(const key of ['theme','type','venue']){const values=new Set(records.map(r=>key==='type'?kind(r):key==='venue'?r.venue_family:r[key]));if(state[key]&&!values.has(state[key]))state[key]='';}
  for(const key of ['from','to'])if(state[key]&&(!/^\d{4}$/.test(state[key])))state[key]='';
  if(!['newest','oldest','title','venue'].includes(state.sort))state.sort=defaults.sort;
  if(!['20','50','100','all'].includes(state.size))state.size=defaults.size;
  page=Math.max(1,Number.parseInt(p.get('page'),10)||1);
}
function save(){if(activeView!=='papers')return;const params=new URLSearchParams();for(const[k,v]of Object.entries(state))if(v!==defaults[k])params.set(k,v);if(page>1)params.set('page',page);try{history.replaceState(null,'',location.pathname+location.search+(params.size?'#'+params.toString():''));}catch(e){/* Some file URL hosts restrict history; reading still works. */}}
function reset(){state={...defaults};render(true);}
for(const key of Object.keys(defaults))$(key).addEventListener(key==='search'?'input':'change',()=>{state[key]=$(key).value;render(true);});
$('reset').addEventListener('click',reset);$('empty-reset').addEventListener('click',reset);
$('source-expand').addEventListener('click',()=>{sourcesExpanded=!sourcesExpanded;renderSources();});
for(const [id,direction]of [['prev',-1],['next',1]])$(id).addEventListener('click',()=>{page+=direction;render();$('papers').scrollIntoView({behavior:'instant'});$('papers').focus({preventScroll:true});});
$('export').addEventListener('click',()=>{
  const fields=[['code','编号'],['bibliographic_year','年份'],['title','论文标题'],['venue','期刊或会议'],['publication_type','类型'],['doi','DOI'],['theme','研究方向'],['pdf','PDF'],['markdown','全文'],['bibtex','引用文件']];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',values=filtered.map(r=>fields.map(([key])=>key==='theme'?themes[r.theme]?.name||r.theme:key==='publication_type'?labels[kind(r)]:r[key]));
  const csv='\ufeff'+[fields.map(([,label])=>label),...values].map(r=>r.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=node('a');a.href=url;a.download='wheeltec-papers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();$(activeView==='projects'?'project-search':'search').focus();}});
overview();restore();render();
window.LibraryEngine={matches,selected,ordered,facet,defaults};
(() => {
  const data=JSON.parse($('project-data').textContent),projects=data.projects;
  const categoryNames=new Map(data.categories.map(c=>[c.id,c.name]));
  const methodNames=new Map(data.methods.map(m=>[m.id,m.name]));
  const byCode=new Map(records.map(r=>[r.code,r]));
  const byId=new Map(projects.map(p=>[p.id,p]));
  const paperProjects=new Map();
  for(const p of projects)for(const code of new Set(p.papers.flatMap(ref=>ref.paper_codes))){if(!paperProjects.has(code))paperProjects.set(code,[]);paperProjects.get(code).push(p);}
  const projectDefaults={search:'',category:'',method:'',environment:'',year:'',project:'',sort:'category',size:'12'};
  let ps={...projectDefaults},projectPage=1,projectFiltered=[],comparison=[];
  const yearsFor=p=>[...new Set(p.papers.flatMap(ref=>{const rows=ref.paper_codes.map(c=>byCode.get(c)?.bibliographic_year).filter(Boolean);return rows.length?rows:ref.year?[ref.year]:[];}))];
  const textByProject=new Map(projects.map(p=>[p.id,[p.name,p.summary,p.description,p.adaptation,p.inputs,p.outputs,p.algorithm_summary,...p.algorithms,...p.environments,...p.methods.map(m=>methodNames.get(m)),...p.papers.map(ref=>ref.title+' '+ref.publication+' '+ref.paper_codes.join(' '))].join(' ').toLocaleLowerCase()]));
  function projectMatches(p,s,omit=''){
    const tokens=s.search.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    return tokens.every(t=>textByProject.get(p.id).includes(t))&&
      (omit==='category'||!s.category||p.category===s.category)&&
      (omit==='method'||!s.method||p.methods.includes(s.method))&&
      (omit==='environment'||!s.environment||p.environments.includes(s.environment))&&
      (omit==='year'||!s.year||yearsFor(p).includes(s.year))&&(!s.project||s.project===p.id);
  }
  function projectSelection(s,omit=''){return projects.filter(p=>projectMatches(p,s,omit));}
  function projectFacets(key){
    const counts=new Map();
    for(const p of projectSelection(ps,key)){
      const values=key==='category'?[p.category]:key==='method'?p.methods:key==='environment'?p.environments:yearsFor(p);
      for(const v of new Set(values))counts.set(v,(counts.get(v)||0)+1);
    }
    return counts;
  }
  const valueLabel=(key,value)=>key==='category'?categoryNames.get(value)||value:key==='method'?methodNames.get(value)||value:key==='project'?byId.get(value)?.name||value:value;
  function projectOptions(key){
    const counts=projectFacets(key),el=$('project-'+key),values=[...counts.keys()].sort((a,b)=>key==='year'?+b-+a:counts.get(b)-counts.get(a)||a.localeCompare(b));
    const first=node('option',{category:'全部方向',method:'全部方法',environment:'全部环境',year:'不限年份'}[key]);first.value='';el.replaceChildren(first);
    for(const value of values){const o=node('option',valueLabel(key,value)+' · '+counts.get(value));o.value=value;el.append(o);}
    if(ps[key]&&!counts.get(ps[key])){const current=node('option',valueLabel(key,ps[key]));current.value=ps[key];current.hidden=true;el.append(current);}
    el.value=ps[key];el.disabled=!values.length&&!ps[key];
  }
  function projectSave(){
    if(activeView!=='projects')return;
    const params=new URLSearchParams({view:'projects'});
    for(const[k,v]of Object.entries(ps))if(v!==projectDefaults[k])params.set(k,v);
    if(projectPage>1)params.set('page',projectPage);
    if(comparison.length)params.set('compare',comparison.join(','));
    try{history.replaceState(null,'',location.pathname+location.search+'#'+params.toString());}catch(e){/* Offline hosts may restrict history. */}
  }
  function projectRestore(){
    const params=new URLSearchParams(location.hash.slice(1));ps={...projectDefaults};
    for(const key of Object.keys(projectDefaults))if(params.has(key))ps[key]=params.get(key);
    for(const[key,values]of [['category',categoryNames],['method',methodNames],['project',byId]])if(ps[key]&&!values.has(ps[key]))ps[key]='';
    if(ps.environment&&!data.environments.includes(ps.environment))ps.environment='';
    if(ps.year&&!/^\d{4}$/.test(ps.year))ps.year='';
    if(!['category','name','year'].includes(ps.sort))ps.sort='category';
    if(!['12','24','all'].includes(ps.size))ps.size='12';
    projectPage=Math.max(1,Number.parseInt(params.get('page'),10)||1);
    comparison=[...new Set((params.get('compare')||'').split(',').filter(id=>byId.has(id)))].slice(0,4);
  }
  function projectOrder(rows){
    const categories=data.categories.map(c=>c.id);
    return [...rows].sort((a,b)=>{
      const fallback=()=>a.name.localeCompare(b.name,undefined,{numeric:true});
      if(ps.sort==='name')return fallback();
      if(ps.sort==='year')return Math.max(0,...yearsFor(b).map(Number))-Math.max(0,...yearsFor(a).map(Number))||fallback();
      return categories.indexOf(a.category)-categories.indexOf(b.category)||projects.indexOf(a)-projects.indexOf(b);
    });
  }
  function references(parent,p){
    for(const ref of p.papers){
      const holder=node('div','','project-reference');
      const title=node('div','','project-reference-title');appendLink(title,ref.url,ref.title);holder.append(title);
      if(ref.publication)holder.append(node('div',ref.publication,'project-reference-meta'));
      const links=node('div','','project-reference-links');
      for(const code of ref.paper_codes){const r=byCode.get(code);if(!r)continue;appendLink(links,r.pdf,'PDF','',code);appendLink(links,r.markdown,'全文','',code);appendLink(links,r.bibtex,'引用','',code);const a=node('a','查看论文条目');a.href='#search='+encodeURIComponent(code);links.append(a);}
      if(links.childNodes.length)holder.append(links);parent.append(holder);
    }
  }
  function projectRow(p){
    const article=node('article','','project-item');article.dataset.project=p.id;article.id='project-'+p.id;
    const grid=node('div','','project-grid'),identity=node('div'),name=node('h3','','project-name');
    appendLink(name,p.repository,p.name);identity.append(name,node('p',categoryNames.get(p.category),'project-category'),node('p',p.summary,'project-summary'));
    const algorithm=node('div');algorithm.append(node('p',p.algorithm_summary,'project-algorithms'));
    const io=node('dl','','project-io');io.append(node('dt','输入'),node('dd',p.inputs),node('dt','输出'),node('dd',p.outputs));algorithm.append(io);
    const implementation=node('div','','project-implementation');implementation.append(node('p',p.environments.join(' · '),'project-runtime'));
    if(p.github.license)implementation.append(node('span',p.github.license,'project-license'));
    const actions=node('div','','project-actions');appendLink(actions,p.repository,'代码 ↗');appendLink(actions,p.github.readme_url,'README ↗');implementation.append(actions);
    const label=node('label','','compare-toggle'),input=node('input');input.type='checkbox';input.dataset.compare=p.id;input.checked=comparison.includes(p.id);input.setAttribute('aria-label','对比 '+p.name);
    input.addEventListener('change',()=>{if(input.checked&&comparison.length<4)comparison.push(p.id);else comparison=comparison.filter(id=>id!==p.id);renderComparison();projectSave();});
    label.append(input,node('span','加入对比'));implementation.append(label);
    grid.append(identity,algorithm,implementation);article.append(grid);
    const details=node('details','','project-details');details.open=ps.project===p.id;
    details.append(node('summary',p.papers.length?'详情与论文':'详情'));
    const body=node('div','','project-detail-body'),description=node('div');description.append(node('h4','方法与实现'),node('p',p.description));
    description.append(node('h4','使用条件','project-conditions-heading'),node('p',p.adaptation));
    if(p.resources.length){const resources=node('div','','project-extra-links');for(const r of p.resources)appendLink(resources,r.url,r.label+' ↗');description.append(resources);}
    const chapter=node('div','','project-extra-links');appendLink(chapter,data.source.url+'#'+p.chapter_anchor,'教材说明 ↗');description.append(chapter);body.append(description);
    if(p.papers.length){const papers=node('div');papers.append(node('h4','相关论文'));references(papers,p);body.append(papers);}
    details.append(body);article.append(details);return article;
  }
  function projectChips(){
    const holder=$('project-chips');holder.replaceChildren();
    for(const key of ['search','category','method','environment','year','project'])if(ps[key]){
      const text={search:'搜索',category:'方向',method:'方法',environment:'环境',year:'论文年份',project:'项目'}[key]+': '+valueLabel(key,ps[key]);
      const button=node('button',text,'chip');button.type='button';button.setAttribute('aria-label','移除筛选：'+text);button.append(node('span','×'));button.addEventListener('click',()=>{ps[key]='';renderProjects(true);});holder.append(button);
    }
    holder.hidden=!holder.childNodes.length;
  }
  function renderProjects(resetPage=false){
    if(resetPage)projectPage=1;
    for(const key of ['category','method','environment','year'])projectOptions(key);
    for(const key of ['search','sort','size'])if($('project-'+key).value!==ps[key])$('project-'+key).value=ps[key];
    projectFiltered=projectOrder(projectSelection(ps));
    const size=ps.size==='all'?Math.max(1,projectFiltered.length):+ps.size,pages=Math.max(1,Math.ceil(projectFiltered.length/size));projectPage=Math.min(projectPage,pages);
    const start=(projectPage-1)*size,end=Math.min(start+size,projectFiltered.length);
    $('project-rows').replaceChildren(...projectFiltered.slice(start,end).map(projectRow));
    $('project-count').textContent=projectFiltered.length+' 个';
    const applied=['search','category','method','environment','year','project'].some(k=>ps[k]);
    $('project-result-summary').textContent=projectFiltered.length?'第 '+(start+1)+'—'+end+' 个':'';
    $('project-result-summary').hidden=!projectFiltered.length;
    $('project-empty').hidden=!!projectFiltered.length;$('project-reset').disabled=!applied;$('project-export').disabled=!projectFiltered.length;
    $('project-prev').disabled=projectPage<=1;$('project-next').disabled=projectPage>=pages;$('project-page-label').textContent='第 '+projectPage+' / '+pages+' 页';
    for(const button of document.querySelectorAll('[data-project-category]'))button.setAttribute('aria-pressed',String(ps.category===button.dataset.projectCategory));
    for(const button of document.querySelectorAll('[data-project-method]'))button.setAttribute('aria-pressed',String(ps.method===button.dataset.projectMethod));
    projectChips();renderComparison();projectSave();
  }
  function renderComparison(){
    const selected=comparison.map(id=>byId.get(id));
    $('comparison').hidden=!selected.length;$('compare-tray').hidden=!selected.length;
    $('compare-count').textContent=selected.length+' / 4';
    $('compare-tray-text').textContent='已选 '+selected.length+' / 4';
    $('compare-open').disabled=selected.length<2;
    for(const input of document.querySelectorAll('input[data-compare]')){input.checked=comparison.includes(input.dataset.compare);input.disabled=comparison.length>=4&&!input.checked;}
    const table=$('compare-table');table.replaceChildren();table.style.minWidth=Math.max(620,110+selected.length*255)+'px';
    const head=node('thead'),headrow=node('tr'),label=node('th','对比项目');label.scope='col';headrow.append(label);
    for(const p of selected){const th=node('th');th.scope='col';appendLink(th,p.repository,p.name);const remove=node('button','移除','compare-remove');remove.type='button';remove.setAttribute('aria-label','移除对比 '+p.name);remove.addEventListener('click',()=>{comparison=comparison.filter(id=>id!==p.id);renderComparison();projectSave();$('compare-clear').focus();});th.append(remove);headrow.append(th);}
    head.append(headrow);table.append(head);
    const body=node('tbody');
    for(const [label,getter]of [['应用方向',p=>categoryNames.get(p.category)],['算法',p=>p.algorithm_summary],['输入',p=>p.inputs],['输出',p=>p.outputs],['运行环境',p=>p.environments.join(' · ')],['R680 适配',p=>p.adaptation],['相关论文',null]]){
      const tr=node('tr'),th=node('th',label);th.scope='row';tr.append(th);
      for(const p of selected){const td=node('td');if(getter)td.textContent=getter(p);else references(td,p);tr.append(td);}body.append(tr);
    }
    table.append(body);
  }
  function sidebar(items,key,id){
    const holder=$(id);holder.replaceChildren();
    for(const item of items){const count=projects.filter(p=>key==='category'?p.category===item.id:p.methods.includes(item.id)).length;if(!count)continue;
      const button=node('button','','theme-card');button.type='button';button.dataset[key==='category'?'projectCategory':'projectMethod']=item.id;button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',item.name+'，'+count+' 个项目');button.append(node('span',item.name,'theme-name'),node('span',String(count),'theme-number'));
      button.addEventListener('click',()=>{const previous=ps[key];ps={...projectDefaults,[key]:previous===item.id?'':item.id};renderProjects(true);$('projects').scrollIntoView({behavior:'instant'});});holder.append(button);
    }
  }
  function activate(view,write=true){
    activeView=view==='projects'&&projects.length?'projects':'papers';
    const isProject=activeView==='projects';
    $('paper-view').hidden=isProject;$('project-view').hidden=!isProject;
    for(const key of ['papers','projects']){const tab=$(key+'-tab'),selected=(key==='projects')===isProject;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;}
    $('skip-content').href=isProject?'#projects':'#papers';
    document.title=(isProject?'开源机器人项目':'移动机器人论文库')+' · WHEELTEC';
    if(write){if(isProject)renderProjects();else render();}
  }
  function navigate(){
    if(location.hash==='#projects'){activate('projects');return;}
    if(['#papers','#overview'].includes(location.hash)){activate('papers');return;}
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.get('view')==='projects'){projectRestore();activate('projects');}
    else{activate('papers',false);restore();render();}
  }
  window.ProjectDirectory={forPaper:code=>paperProjects.get(code)||[],matches:projectMatches,selected:projectSelection,yearsFor};
  $('paper-tab-count').textContent=String(records.length);$('project-tab-count').textContent=String(projects.length);$('projects-tab').hidden=!projects.length;
  sidebar(data.categories,'category','project-categories');sidebar(data.methods,'method','project-methods');
  for(const key of ['search','category','method','environment','year','sort','size'])$('project-'+key).addEventListener(key==='search'?'input':'change',()=>{ps[key]=$('project-'+key).value;renderProjects(true);});
  const projectReset=()=>{ps={...projectDefaults};renderProjects(true);};
  $('project-reset').addEventListener('click',projectReset);$('project-empty-reset').addEventListener('click',projectReset);
  for(const[id,delta]of [['project-prev',-1],['project-next',1]])$(id).addEventListener('click',()=>{projectPage+=delta;renderProjects();$('projects').scrollIntoView({behavior:'instant'});$('projects').focus({preventScroll:true});});
  for(const id of ['compare-clear','compare-tray-clear'])$(id).addEventListener('click',()=>{comparison=[];renderComparison();projectSave();$('project-count').parentElement.scrollIntoView({behavior:'instant'});$('project-search').focus({preventScroll:true});});
  $('compare-open').addEventListener('click',()=>{$('comparison').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});$('comparison').tabIndex=-1;$('comparison').focus({preventScroll:true});});
  for(const view of ['papers','projects'])$(view+'-tab').addEventListener('click',()=>activate(view));
  document.querySelector('.collection-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const view=e.key==='Home'?'papers':e.key==='End'?'projects':activeView==='projects'?'papers':'projects';activate(view);$(activeView+'-tab').focus();});
  $('project-export').addEventListener('click',()=>{
    const headings=['项目','应用方向','算法','输入','输出','运行环境','R680 适配','代码仓库','相关论文','PDF','全文'];
    const rows=projectFiltered.map(p=>{const holdings=[...new Set(p.papers.flatMap(ref=>ref.paper_codes))].map(code=>byCode.get(code)).filter(Boolean);return [p.name,categoryNames.get(p.category),p.algorithms.join('; '),p.inputs,p.outputs,p.environments.join('; '),p.adaptation,p.repository,p.papers.map(ref=>ref.url).join('; '),holdings.map(r=>r.pdf).filter(Boolean).join('; '),holdings.map(r=>r.markdown).filter(Boolean).join('; ')];});
    const cell=value=>'"'+String(value??'').replace(/"/g,'""')+'"',csv='\ufeff'+[headings,...rows].map(row=>row.map(cell).join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=node('a');a.href=url;a.download='wheeltec-open-source-projects.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  window.addEventListener('hashchange',navigate);
  if(activeView==='projects')projectRestore();activate(activeView);
})();
